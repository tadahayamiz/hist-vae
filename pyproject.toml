[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histvae"
version = "0.1.0"
description = "a package for extracting point cloud and histogram based representations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tadahaya Mizuno" }
]
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "matplotlib",
  "tqdm",
]
classifiers = [
  "Programming Language :: Python :: 3.10"
]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/mizuno-group/hist-vae"
Repository = "https://github.com/mizuno-group/hist-vae"

[project.scripts]
histvae = "histvae.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["histvae*"]

[tool.setuptools.package-data]
histvae = ["config.yaml"]
