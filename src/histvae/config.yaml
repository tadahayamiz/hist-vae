# config file (yaml)
# === I/O ===
device: null
exp_name: null
# === Data ===
num_points: 2048
in_channels: 1
in_dims: 2
min_vals: null  # defaults to zero on every active axis
max_vals: [10000, 10000]
bins: 64
histogram_mode: count  # count, density, or probability_mass
out_of_range_policy: drop  # legacy: drop, clip, or error
value_transform: none  # none/log1p globally or one value per axis
train_sampling_mode: random
eval_sampling_mode: full
train_target_sampling_mode: paired  # paired (legacy) or full
eval_target_sampling_mode: full
num_workers: 4
pin_memory: True
# === Conv VAE ===
latent_dim: 128
hidden_dims: [32, 64, 128, 256]
dropout_conv: 0.3
decoder_output_mode: legacy_sigmoid  # legacy_sigmoid or simplex_softmax
reconstruction_loss: mse  # mse or forward_kl
condition_mode: none  # none or decoder
condition_dim: 0
beta: 1.0  # final latent-KL weight
latent_kl_schedule: constant  # constant or linear_warmup
latent_kl_warmup_epochs: 0
# === Linear head ===
# latent_dim: 128
num_classes: 2
num_layers: 2
hidden_head: 512
dropout_head: 0.3
frozen: True
use_pretrain_loss: False
# === Training ===
optimizer: radam_schedule_free  # radam_schedule_free or radam
batch_size: 32
epochs: 200
lr: 0.01
weight_decay: 0.0
transform: True
accum_grad: 1
clip_grad: 1.0
save_model_every: 10
patience: 10
early_stop_mode: 'min'
pretrain_monitor: test_recon
finetune_monitor: test_loss
active_latent_threshold: 0.01
# === Logging ===
log_every: 2
